[project]
name = "fieldnotes"
version = "0.1.0"
description = "A small shared notebook backed by Azure Blob Storage"
requires-python = ">=3.12,<3.13"
dependencies = [
    "azure-identity==1.25.3",
    "azure-storage-blob==12.30.2",
    "fastapi==0.141.1",
    "pydantic==2.13.5",
    "uvicorn==0.53.0",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fieldnotes"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/fieldnotes"]

[dependency-groups]
dev = [
    "httpx2==2.13.0",
    "mypy==2.3.1",
    "pytest==9.1.1",
    "ruff==0.16.8",
]
